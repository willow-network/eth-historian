[package]
name = "eth-historian-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for eth-historian — trustless Ethereum historical block verification."
license = "MIT OR Apache-2.0"
repository = "https://github.com/willow-network/eth-historian"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
eth-historian = { path = "../..", default-features = false }
ssz = { package = "ethereum_ssz", version = "0.9" }

pyo3 = { version = "0.24", features = ["extension-module"] }
tokio = { version = "1", features = ["rt", "sync"] }
hex = "0.4"
