[package]
name = "eth-historian"
version = "0.1.0"
edition = "2021"
description = "Trustless cryptographic authentication of historical Ethereum execution-layer blocks for off-chain consumers."
license = "MIT OR Apache-2.0"
repository = "https://github.com/willow-network/eth-historian"
homepage = "https://github.com/willow-network/eth-historian"
documentation = "https://docs.rs/eth-historian"
readme = "README.md"
keywords = ["ethereum", "verification", "light-client", "historical", "portal"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]
authors = ["Paul DeLucia <pauldelucia2@gmail.com>", "Willow Network contributors"]
rust-version = "1.85"

[dependencies]
# Ethereum primitives + alloy consensus header type. Used by both the
# vendored Portal types and the verifier. `rlp` is needed by
# `portal_types::execution::ssz_header` (RLP-in-SSZ codec).
alloy = { version = ">=1.1, <1.6", default-features = false, features = ["consensus", "eips", "rlp", "serde"] }
alloy-rlp = "0.3"
# MPT proof verification — used by `inclusion` module to verify receipts /
# transactions against the authenticated roots in `VerifiedBlock`.
alloy-trie = "0.9"

# SSZ + tree hashing — same versions trin uses.
ethereum_ssz = "0.9"
ethereum_ssz_derive = "0.9"
ethereum_hashing = "0.7"
ssz_types = "0.11"
tree_hash = "0.10"
tree_hash_derive = "0.10"

# Beacon-block + body fork variants. `superstruct` generates per-fork types
# with minimal boilerplate; `rs_merkle` is used by the historical-roots
# proof-construction helper. `ethereum_serde_utils` and `serde-this-or-that`
# handle quoted-numeric and bytes-as-hex JSON encodings used by beacon-API
# responses. Versions match trin's at commit 30aeef8 — the upstream from
# which the consensus types are vendored.
superstruct = "0.7"
ethereum_serde_utils = "0.8"
serde-this-or-that = "0.5"
rs_merkle = "1.4"

# Asset embedding.
rust-embed = "8"

# Misc
anyhow = "1"
async-trait = "0.1"
hex = "0.4"
lazy_static = "1.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

# Optional: HTTP client for archive-RPC and Portal-sidecar data sources.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }

[features]
default = ["archive-rpc", "portal-sidecar"]
archive-rpc = ["reqwest"]
portal-sidecar = ["reqwest"]
# era1 = ["e2store"] — disabled in v0.1 due to a c-kzg native-link
# conflict between e2store 0.4 (pulls ethportal-api 0.8 / c-kzg 1.x)
# and our previous ethportal-api 0.12 dep (c-kzg 2.x). Now that
# ethportal-api is no longer a transitive dep (vendored), re-enabling
# era1 should be straightforward — tracked at
# https://github.com/willow-network/eth-historian/issues/1.

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
wiremock = "0.6"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
