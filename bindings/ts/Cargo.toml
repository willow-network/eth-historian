[package]
name = "eth-historian-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for eth-historian — trustless Ethereum historical block verification."
license = "MIT OR Apache-2.0"
repository = "https://github.com/willow-network/eth-historian"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pure-verification bindings: archive-rpc / portal-sidecar features
# require reqwest which is awkward in wasm. Apps fetch bytes their own
# way and pass them in.
eth-historian = { path = "../..", default-features = false }

ssz = { package = "ethereum_ssz", version = "0.9" }
# Direct alloy-primitives dep so the FFI shim can construct `B256` from
# raw bytes without going through a higher-level alloy umbrella.
alloy-primitives = "1"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
hex = "0.4"

# Activate wasm-friendly tokio features (sync only — no I/O runtime in wasm).
tokio = { version = "1", features = ["sync"] }

console_error_panic_hook = "0.1"

# When building for wasm32 we have to opt every transitive `getrandom`
# version into JS-shimmed entropy. Without this, the `wasm*-unknown-unknown`
# target rejects `getrandom` at compile time (no default entropy source
# on bare wasm). The feature name changed across major versions:
# 0.2.x = "js", 0.3.x and later = "wasm_js".
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
