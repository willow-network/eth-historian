[package]
name = "eth-historian"
version = "0.1.0"
edition = "2021"
description = "Trustless cryptographic authentication of historical Ethereum execution-layer blocks for off-chain consumers."
license = "MIT OR Apache-2.0"
repository = "https://github.com/willow-network/eth-historian"
homepage = "https://github.com/willow-network/eth-historian"
documentation = "https://docs.rs/eth-historian"
readme = "README.md"
keywords = ["ethereum", "verification", "light-client", "historical", "portal"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]
authors = ["Paul DeLucia <pauldelucia2@gmail.com>", "Willow Network contributors"]
rust-version = "1.85"

[dependencies]
# Portal types vendored via ethportal-api: HeaderWithProof, BlockProofHistorical*,
# HistoricalRoots, HistoricalSummaries, network_spec, content keys.
ethportal-api = "0.12"

# Ethereum primitives + alloy consensus header type.
alloy = { version = ">=1.1, <1.6", default-features = false, features = ["consensus", "eips", "rpc-types-beacon", "serde"] }
alloy-hardforks = "0.2"

# SSZ + tree hashing — same versions trin uses.
ethereum_ssz = "0.9"
ethereum_ssz_derive = "0.9"
ethereum_hashing = "0.7"
ssz_types = "0.11"
tree_hash = "0.10"
tree_hash_derive = "0.10"

# Asset embedding.
rust-embed = "8"

# Misc
anyhow = "1"
async-trait = "0.1"
hex = "0.4"
lazy_static = "1.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

# Optional: HTTP client for archive-RPC and Portal-sidecar data sources.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }

[features]
default = ["archive-rpc", "portal-sidecar"]
archive-rpc = ["reqwest"]
portal-sidecar = ["reqwest"]
# era1 = ["e2store"] — currently disabled: e2store 0.4 pulls ethportal-api
# 0.8 which conflicts with our 0.12 dep on the c-kzg native lib. Will
# re-enable when e2store's ethportal-api dep catches up. Tracked as
# v0.2 follow-up.

[build-dependencies]
# Workaround: `ethportal-api 0.12.0`'s build script depends on `vergen`
# with a caret range that picks `vergen 9.1.x`, which (a) has an `Add`
# trait incompatible with `vergen-git2 1.0.7`'s `Git2` impl and (b)
# raises MSRV from 1.87 to 1.88. Pinning our own build-dep to `~9.0`
# constrains the resolver to `9.0.x` for everyone in the dep graph.
# Once `ethportal-api` ships a fix (filed and closed at
# https://github.com/ethereum/trin/pull/1899) this can be removed.
vergen = "~9.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
wiremock = "0.6"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
